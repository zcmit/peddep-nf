report_comment: >
  Generated by <a href="https://github.com/zcmit/peddep-nf">zcmit/peddep-nf</a> (HiChIP).
  The <b>PEDDEP QC grades</b> section scores each metric from -2 to +2; the overall grade is the mean score.

report_section_order:
  peddep_hichip_grades:
    order: 1000
  software_versions:
    order: -1000

module_order:
  - fastqc:
      name: "FastQC (raw reads)"
      anchor: "fastqc_raw"
      info: "FastQC on the raw reads, per lane."
  - pairtools
  - macs2

extra_fn_clean_exts:
  - ".dedup"

export_plots: true
