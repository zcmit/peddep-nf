report_comment: >
  Generated by <a href="https://github.com/zcmit/peddep-nf">zcmit/peddep-nf</a> (ChIP-seq / CUT&RUN).
  The <b>PEDDEP QC grades</b> section scores each metric from -2 to +2; the overall grade is the mean score.

report_section_order:
  peddep_chip_grades:
    order: 1000
  peddep_cutrun_grades:
    order: 1000
  software_versions:
    order: -1000

module_order:
  - fastqc:
      name: "FastQC (raw reads)"
      anchor: "fastqc_raw"
      info: "FastQC on the raw reads, per lane."
      path_filters:
        - "*_R1_fastqc.zip"
        - "*_R2_fastqc.zip"
        - "*_L[0-9]_fastqc.zip"
        - "*_L[0-9][0-9]_fastqc.zip"
  - cutadapt:
      name: "Trim Galore / cutadapt"
  - fastqc:
      name: "FastQC (trimmed reads)"
      anchor: "fastqc_trimmed"
      info: "FastQC on the reads after adapter trimming."
      path_filters:
        - "*_val_1_fastqc.zip"
        - "*_val_2_fastqc.zip"
        - "*_trimmed_fastqc.zip"
  - bowtie2
  - picard
  - samtools
  - phantompeakqualtools
  - deeptools
  - macs2

extra_fn_clean_exts:
  - ".bowtie2"
  - ".plotFingerprint"
  - ".plotProfile"
  - ".spp"

export_plots: true
